<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — RateAt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="IMG/LOGO RATEEAT.png" alt="Logo RateAt">
    <span>RateAt</span>
  </a>
  <nav>
    <a href="index.html">Início</a>
    <a href="restaurantes.html">Restaurantes</a>
    <a href="avaliar.html">Avaliar</a>
    <a href="cadastro.html" class="ativo">Cadastro</a>
    <a href="login.html">Entrar</a>
  </nav>
</header>

<main style="display:flex; justify-content:center;">
  <div style="width:100%; max-width:460px;">
    <h1 style="text-align:center; margin-bottom:24px;"> Criar Conta</h1>

    <div class="caixa-form">
      <form action="usuario/salvarusuario.php" method="post">

        <div class="form-grupo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primario">Criar conta</button>
          <button type="reset" class="btn btn-contorno">Limpar</button>
        </div>

        <p style="margin-top:16px; text-align:center; font-size:0.9rem; color:var(--contorno);">
          Já tem conta? <a href="login.html" style="color:var(--primaria-container);">Entrar</a>
        </p>

      </form>
    </div>
  </div>
</main>

<footer>
  2026 RateAt
</footer>

</body>
</html>
